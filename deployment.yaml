apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-actions-demo-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: github-actions-demo

  template:
    metadata:
      labels:
        app: github-actions-demo

    spec:
      containers:
      - name: github-actions-demo
        image: harshiks3/github-actions-demo

        ports:
        - containerPort: 80